[workspace]
members = [
    "programs/*",
    "crates/*",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# magicraft-core is integer-only and tested for overflow in debug builds (checks on); in the
# SBF release build checked arithmetic (notably i64 multiply, emulated via 128-bit routines)
# made stage 1 cost > 1.4M CU instead of ~0.55M (docs/notes/spikes.md, Task 17; ~0.16M since
# Task 17b). The program crate keeps overflow checks. Results are identical whenever no
# overflow occurs.
[profile.release.package.magicraft-core]
overflow-checks = false

# The wasm client build of the core (app/src/wasm) must match onchain results: same setting.
[profile.release.package.magicraft-core-wasm]
overflow-checks = false
