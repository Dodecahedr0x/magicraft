[package]
name = "magicraft"
version = "0.1.0"
description = "Magicraft: onchain voxel survival on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "magicraft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.1"
ephemeral-rollups-sdk = { version = "0.17", features = ["anchor", "vrf"] }
session-keys = { version = "3", features = ["no-entrypoint"] }
magicblock-magic-program-api = "0.14"
bincode = "1"
magicraft-core = { path = "../../crates/core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
